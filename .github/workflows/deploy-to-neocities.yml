name: Deploy to neocities
on:
  push:
    branches: [main]

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Commit
        env:
          DOCUMENTATION_SHA: ${{ github.sha }}
        run: |
          git -C /workspace/repos/documentation fetch origin main
          git -C /workspace/repos/documentation checkout --detach "$DOCUMENTATION_SHA"
          echo "Documentation commit: $(git -C /workspace/repos/documentation rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: /entrypoint.sh build-documentation
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: /workspace/repos/documentation/build/
          if-no-files-found: error

  deploy:
    name: Deploy to Neocities
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: build
      - name: Deploy to neocities
        uses: bcomnes/deploy-to-neocities@v2
        with:
          api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: false
          dist_dir: build
